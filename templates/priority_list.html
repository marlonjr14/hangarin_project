{% extends 'base.html' %}
{% block title %}Priorities{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Priorities</h2>
    <a href="{% url 'priority-add' %}" class="btn btn-primary">
        <i class="la la-plus"></i> Add Priority
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for priority in priorities %}
                <tr>
                    <td>{{ priority.name }}</td>
                    <td>
                        <a href="{% url 'priority-update' priority.pk %}" class="btn btn-sm btn-warning"><i
                                class="la la-edit"></i></a>
                        <a href="{% url 'priority-delete' priority.pk %}" class="btn btn-sm btn-danger"><i
                                class="la la-trash"></i></a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center text-muted">No priorities yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% include 'includes/pagination.html' %}
{% endblock %}
